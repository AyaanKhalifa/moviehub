<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Pure Black Background with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#000000" stroke="#f5c518" stroke-width="3"/>
  
  <!-- Cinema Gold Film Badge -->
  <rect x="12" y="14" width="40" height="36" rx="6" fill="#f5c518"/>
  
  <!-- Top Film Sprockets -->
  <rect x="16" y="17" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="25" y="17" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="34" y="17" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="43" y="17" width="5" height="6" rx="1.5" fill="#000000"/>

  <!-- Bottom Film Sprockets -->
  <rect x="16" y="41" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="25" y="41" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="34" y="41" width="5" height="6" rx="1.5" fill="#000000"/>
  <rect x="43" y="41" width="5" height="6" rx="1.5" fill="#000000"/>

  <!-- Center Cinema Play Triangle -->
  <polygon points="28,26 40,32 28,38" fill="#000000"/>
</svg>