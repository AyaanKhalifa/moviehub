<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Pure Black Background with Gold Border -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="#000000" stroke="#f5c518" stroke-width="20"/>
  
  <!-- Cinema Gold Film Badge -->
  <rect x="96" y="112" width="320" height="288" rx="48" fill="#f5c518"/>
  
  <!-- Top Film Sprockets -->
  <rect x="128" y="136" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="200" y="136" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="272" y="136" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="344" y="136" width="40" height="48" rx="12" fill="#000000"/>

  <!-- Bottom Film Sprockets -->
  <rect x="128" y="328" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="200" y="328" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="272" y="328" width="40" height="48" rx="12" fill="#000000"/>
  <rect x="344" y="328" width="40" height="48" rx="12" fill="#000000"/>

  <!-- Center Cinema Play Triangle -->
  <polygon points="224,208 320,256 224,304" fill="#000000"/>
</svg>
